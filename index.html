<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to ICCBI</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background: radial-gradient(120% 140% at 15% 0%, #1E293B 0%, #274fab 55%, #1E3A8A 100%);
            color: #FFFFFF;
        }

        .loader {
            position: relative;
            inset: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
            overflow: hidden;
        }

        /* Matches the Index Hero Background Image Overlay */
        .loader::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url('assets/images/Imaculate.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(.15) saturate(.2);
            opacity: .4;
            z-index: 0;
            pointer-events: none;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Logo Section */
        .logo {
            font-family: 'UnifrakturCook', 'Fraunces', serif;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 30px;
            opacity: 0;
            animation: logoFadeIn 1s ease forwards;
            text-shadow: 0 4px 12px rgba(0,0,0,0.4);
            color: #F0F9FF;
            position: relative;
            z-index: 1;
        }
        .logo img {
            max-width: 150px;
            max-height: 150px;
            object-fit: contain;
        }

        /* Text Sections - FIXED TO PERFECTLY CENTER OVERLAP */
        .message {
            position: absolute; /* Overlaps perfectly */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            width: 100%;
            max-width: 820px;
            padding: 0 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            text-align: center;
        }

        .message.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* The Blue Capsule Badge */
        .greeting-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(147, 197, 253, .45);
            padding: 6px 12px;
            border-radius: 999px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: .65rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #93C5FD;
            margin-bottom: 20px;
        }
        .greeting-badge::before {
            content: "✦";
        }

        /* The Large Hero Text */
        .main-greeting {
            font-family: 'Fraunces', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 600;
            line-height: 1.05;
            color: #F0F9FF;
            margin-bottom: 18px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .main-greeting em {
            font-style: italic;
            color: #93C5FD;
        }

        /* Fade animations */
        @keyframes logoFadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes logoFadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="loader" id="loader">
        <div class="logo" id="logo">
            <!-- Replace text below with your actual logo image code -->
            ICCBI
            <!-- <img src="assets/images/logo.png" alt="ICCBI Logo"> -->
        </div>
        
        <div class="message" id="message">
            <!-- The Blue Capsule Badge with the time-based greeting -->
            <div class="greeting-badge" id="greetingBadge">Hello, Good morning!</div>
            
            <!-- The Large Hero Text 1 -->
            <h1 class="main-greeting">The God in Me greets the God in You, <em>Godbless You!</em></h1>
        </div>

        <div class="message" id="message2">
            <!-- The Large Hero Text 2 -->
            <h1 class="main-greeting">Welcome to <em>ICCBI!</em></h1>
        </div>
    </div>

    <script>
        (function() {
            // 1. Get time and determine greeting
            const today = new Date();
            const hour = today.getHours();
            let greeting = "";

            if (hour >= 5 && hour < 12) {
                greeting = "Hello, Good morning!";
            } else if (hour >= 12 && hour < 18) {
                greeting = "Hello, Good afternoon!";
            } else {
                greeting = "Hello, Good evening!";
            }

            // 2. Set the greeting badge text
            document.getElementById('greetingBadge').textContent = greeting;

            const logo = document.getElementById('logo');
            const message1 = document.getElementById('message');
            const message2 = document.getElementById('message2');

            // 3. Animation sequence
            setTimeout(() => {
                // Logo fades out suddenly
                logo.style.animation = 'logoFadeOut 0.3s ease forwards';
            }, 2000); // Show logo for 2 seconds

            setTimeout(() => {
                // Hide logo entirely and show first text
                logo.style.display = 'none';
                message1.classList.add('show');
            }, 2400); 

            setTimeout(() => {
                // Fade out first text
                message1.classList.remove('show');
            }, 6000); // Show text 1 for 3.6 seconds

            setTimeout(() => {
                // Show second text ("Welcome to ICCBI!")
                message2.classList.add('show');
            }, 6800);

            setTimeout(() => {
                // Fade out second text
                message2.classList.remove('show');
            }, 9500);

            setTimeout(() => {
                // Full screen fades out and redirects
                const loader = document.getElementById('loader');
                loader.classList.add('hidden');
            }, 10300);

            setTimeout(() => {
                // Redirect to main page
                // (IMPORTANT: Rename your main index to 'home.html' to avoid a loop, or change this to 'index.html')
                window.location.href = 'home.html'; 
            }, 11000);
        })();
    </script>

</body>
</html>
