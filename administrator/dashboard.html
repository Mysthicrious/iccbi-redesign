}

<script>
(function(){
  'use strict';
  var $ = function(id){return document.getElementById(id)};
  var SERVER_USER = <?= json_encode(['name'=>$_SESSION['user']['name'],'email'=>$_SESSION['user']['email']], JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT) ?>;
  var KEY_LOG='iccbi_log', KEY_SB='iccbi_sidebar';
  var store = {
    get:function(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
    set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
    del:function(k){try{localStorage.removeItem(k)}catch(e){}}
  };
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function initials(n){return n.trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase()||'?'}
  function fmt(iso){return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}

  /* ---- Sidebar ---- */
  var mobile = window.matchMedia('(max-width:860px)');
  if(store.get(KEY_SB)==='collapsed') document.body.classList.add('collapsed');
  $('sbToggle').addEventListener('click',function(){
    var c=document.body.classList.toggle('collapsed');
    store.set(KEY_SB,c?'collapsed':'full');
    this.setAttribute('aria-expanded',String(!c));
  });
  function drawer(open){document.body.classList.toggle('drawer',open)}
  $('burger').addEventListener('click',function(){drawer(true)});
  $('scrim').addEventListener('click',function(){drawer(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')drawer(false)});
  mobile.addEventListener('change',function(){drawer(false)});

  /* ---- Activity log ---- */
  function seedLog(){
    var now=Date.now(),h=36e5;
    return [
      {u:'Registrar Office',a:'Updated enrollment page',t:new Date(now-5*h).toISOString(),s:'ok'},
      {u:'Guidance Office',a:'Submitted event for approval',t:new Date(now-27*h).toISOString(),s:'warn'},
      {u:'Library',a:'Failed upload: schedule.pdf',t:new Date(now-50*h).toISOString(),s:'bad'},
      {u:'Registrar Office',a:'Published announcement',t:new Date(now-76*h).toISOString(),s:'ok'}
    ];
  }
  function getLog(){var l=store.get(KEY_LOG);if(!l){l=seedLog();store.set(KEY_LOG,l)}return l}
  function addLog(entry){var l=getLog();l.unshift(entry);store.set(KEY_LOG,l.slice(0,50))}
  var STATUS={ok:'Completed',warn:'Pending',bad:'Failed'};
  function renderLog(){
    var q=($('logSearch').value||$('globalSearch').value||'').toLowerCase();
    var rows=getLog().filter(function(r){return (r.u+' '+r.a).toLowerCase().indexOf(q)>-1}).slice(0,10);
    $('logCount').textContent=rows.length+' recent '+(rows.length===1?'entry':'entries');
    $('logBody').innerHTML=rows.length?rows.map(function(r){
      return '<tr><td><div class="who"><div class="avatar">'+esc(initials(r.u))+'</div>'+esc(r.u)+'</div></td>'+
        '<td>'+esc(r.a)+'</td><td>'+fmt(r.t)+'</td><td><span class="pill '+r.s+'">'+STATUS[r.s]+'</span></td></tr>';
    }).join(''):'<tr><td colspan="4" class="empty">No activity matches your search.</td></tr>';
  }
  $('logSearch').addEventListener('input',function(){$('globalSearch').value='';renderLog()});
  $('globalSearch').addEventListener('input',function(){$('logSearch').value='';renderLog()});

  /* ---- Sign-in detection ---- */
  function showUser(u){
    $('uName').textContent=u.name; $('uMail').textContent=u.email; $('uAvatar').textContent=initials(u.name);
    var h=new Date().getHours();
    $('greet').textContent=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+', '+u.name.split(' ')[0]+'.';
  }
  function gate(){ showUser(SERVER_USER); }
  $('logout').addEventListener('click',function(){ location.href='logout.php'; });

  /* ---- Calendar ---- */
  var EVENTS=[ /* edit these: yyyy-mm-dd */
    {d:'2026-11-09',t:'Faculty meeting',n:'Main conference room'},
    {d:'2026-11-20',t:'Midterm grades due',n:'Registrar'},
    {d:'2026-12-08',t:'Feast of the Immaculate Conception',n:'Whole school'},
    {d:'2026-12-18',t:'Christmas program',n:'Gymnasium'}
  ];
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var view=new Date(); view.setDate(1);
  function key(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
  function renderCal(){
    var y=view.getFullYear(), m=view.getMonth(), now=new Date();
    $('calTitle').textContent=MONTHS[m]+' '+y;
    var first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), prevDays=new Date(y,m,0).getDate();
    var html=['S','M','T','W','T','F','S'].map(function(d){return '<div class="dow">'+d+'</div>'}).join('');
    for(var i=first-1;i>=0;i--) html+='<div class="day muted">'+(prevDays-i)+'</div>';
    for(var d=1;d<=days;d++){
      var k=key(y,m,d), cls='day';
      if(d===now.getDate()&&m===now.getMonth()&&y===now.getFullYear()) cls+=' today';
      if(EVENTS.some(function(e){return e.d===k})) cls+=' has';
      html+='<div class="'+cls+'">'+d+'</div>';
    }
    var total=first+days, tail=(7-total%7)%7;
    for(var j=1;j<=tail;j++) html+='<div class="day muted">'+j+'</div>';
    $('cal').innerHTML=html;
    var list=EVENTS.filter(function(e){return e.d.slice(0,7)===key(y,m,1).slice(0,7)});
    $('events').innerHTML=list.length?list.map(function(e){
      var p=e.d.split('-');
      return '<div class="ev"><div class="d">'+Number(p[2])+'<small>'+MONTHS[m].slice(0,3)+'</small></div><div>'+esc(e.t)+'<span>'+esc(e.n)+'</span></div></div>';
    }).join(''):'<p style="color:var(--soft);font-size:14px">No events this month.</p>';
  }
  $('prev').addEventListener('click',function(){view.setMonth(view.getMonth()-1);renderCal()});
  $('next').addEventListener('click',function(){view.setMonth(view.getMonth()+1);renderCal()});

  $('today').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  if(!sessionStorage.getItem('iccbi_seen')){addLog({u:SERVER_USER.name,a:'Signed in',t:new Date().toISOString(),s:'ok'});try{sessionStorage.setItem('iccbi_seen','1')}catch(e){}}
  renderLog(); renderCal(); gate();
})();
</script>
